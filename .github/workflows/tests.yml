# Her push ve pull request'te birim testlerini ve tarayıcıyla uçtan uca testleri çalıştırır.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -e ".[dev]"
      - name: Birim testleri
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları ve Chromium'u kur
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Uçtan uca testler
        env:
          NGUI_E2E: "1"
        run: pytest -q tests/e2e
